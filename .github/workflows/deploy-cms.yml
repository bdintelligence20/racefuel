name: Deploy CMS to Cloud Run

# Triggers only when files under cms/** change so frontend pushes don't
# rebuild the CMS image (and vice-versa). Manual dispatch is available for
# rolling back or redeploying without a code change.
on:
  push:
    branches: [main]
    paths:
      - 'cms/**'
      - '.github/workflows/deploy-cms.yml'
  workflow_dispatch:

env:
  PROJECT_ID: promogroup
  REGION: us-central1
  SERVICE: racefuel-cms
  IMAGE: us-central1-docker.pkg.dev/promogroup/cloud-run-source-deploy/racefuel-cms
  # GCS bucket mounted at /data so Strapi's SQLite file survives revisions.
  # Must already exist before the first deploy. Create with:
  #   gsutil mb -l us-central1 gs://fuelcue-cms-data
  DATA_BUCKET: fuelcue-cms-data
  # GCS bucket where the upload provider writes media. Cloud Run SA needs
  # roles/storage.objectAdmin on it.
  UPLOADS_BUCKET: fuelcue-cms-uploads

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.IMAGE }}:latest \
            ./cms

      - name: Push Docker image
        run: |
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      # Cloud Run gen2 execution environment is required for GCS volume
      # mounts. max-instances=1 because SQLite over GCS FUSE can't survive
      # concurrent writers — a single editor is the only safe shape.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image ${{ env.IMAGE }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --platform managed \
            --execution-environment gen2 \
            --allow-unauthenticated \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 1 \
            --port 1337 \
            --add-volume name=cms-data,type=cloud-storage,bucket=${{ env.DATA_BUCKET }} \
            --add-volume-mount volume=cms-data,mount-path=/data \
            --set-env-vars HOST=0.0.0.0,PORT=1337,NODE_ENV=production,DATABASE_CLIENT=sqlite,DATABASE_FILENAME=/data/cms.db,GCS_BUCKET_NAME=${{ env.UPLOADS_BUCKET }},GCS_BASE_PATH=blog \
            --set-secrets APP_KEYS=cms-app-keys:latest,API_TOKEN_SALT=cms-api-token-salt:latest,ADMIN_JWT_SECRET=cms-admin-jwt-secret:latest,TRANSFER_TOKEN_SALT=cms-transfer-token-salt:latest,JWT_SECRET=cms-jwt-secret:latest \
            --quiet
